name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, validate & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Validate manifest, i18n keys and runtime assets
        run: npm run validate

      - name: Unit tests
        run: npm test

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build the release ZIP
        run: bash build.sh

      - name: Verify the ZIP carries everything the module loads at runtime
        run: |
          set -euo pipefail
          # Derive the name rather than globbing: releases/ is gitignored in CI,
          # but a stale ZIP would otherwise be inspected instead of the new one.
          ZIP="releases/$(jq -r '.id + "-v" + .version' module.json).zip"
          echo "Inspecting $ZIP"
          CONTENTS=$(unzip -Z1 "$ZIP")

          # Everything module.json points at, plus the assets loaded by path at
          # runtime: the Handlebars templates and the Web Worker. Neither is
          # reachable from the manifest, so nothing else would catch their loss.
          {
            jq -r '[ .esmodules[]?, .styles[]?, (.languages[]?.path) ] | .[]' module.json
            printf '%s\n' module.json scripts/workers/IndexWorker.js LICENSE
            find templates -name '*.hbs' | sort
          } > required.txt

          MISSING=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! grep -Fxq "$file" <<< "$CONTENTS"; then
              echo "::error::missing from package: $file"
              MISSING=1
            fi
          done < required.txt
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "Package contents verified ($(wc -l < required.txt) required entries)"

      - uses: actions/upload-artifact@v7
        with:
          name: module-package
          path: releases/*.zip
          retention-days: 14
